<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema de Licitações</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; max-width: 400px; width: 100%; text-align: center; }
        h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn { background: #1e3a8a; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; font-size: 15px; margin-top: 10px; }
        .btn:hover { background: #152960; }
        .toggle-link { margin-top: 15px; font-size: 13px; color: #1e3a8a; cursor: pointer; display: block; text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-card">
    <h1 id="tituloTela">🔑 Entrar no Sistema</h1>
    <p id="subtituloTela">Digite suas credenciais para gerenciar as propostas.</p>

    <div class="form-group">
        <label>E-mail institucional</label>
        <input type="email" id="email" placeholder="seu-email@empresa.com.br">
    </div>
    <div class="form-group">
        <label>Senha de acesso</label>
        <input type="password" id="senha" placeholder="••••••••">
    </div>

    <button class="btn" id="btnAcao" onclick="executarAutenticacao()">Entrar</button>
    
    <span class="toggle-link" id="btnAlternar" onclick="alternarModo()">Não tem uma conta? Cadastre-se aqui</span>
</div>

<script>
// --- MOTOR INTERNO DE AUTENTICAÇÃO VIA API REST DO SUPABASE ---
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_bdvQu1yCW8Oa_s6z8XVXug_ByArUwt-";
let modoLogin = true; 

function alternarModo() {
    modoLogin = !modoLogin;
    const titulo = document.getElementById("tituloTela");
    const subtitulo = document.getElementById("subtituloTela");
    const btnAcao = document.getElementById("btnAcao");
    const btnAlternar = document.getElementById("btnAlternar");

    if (modoLogin) {
        titulo.innerText = "🔑 Entrar no Sistema";
        subtitulo.innerText = "Digite suas credenciais para gerenciar as propostas.";
        btnAcao.innerText = "Entrar";
        btnAlternar.innerText = "Não tem uma conta? Cadastre-se aqui";
    } else {
        titulo.innerText = "📝 Criar Nova Conta";
        subtitulo.innerText = "Cadastre um novo e-mail para acessar o painel.";
        btnAcao.innerText = "Criar Conta";
        btnAlternar.innerText = "Já possui uma conta? Faça o Login";
    }
}

async function requisicaoAuth(endpoint, body) {
    try {
        const resposta = await fetch(`${SUPABASE_URL}/auth/v1/${endpoint}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify(body)
        });
        return await resposta.json();
    } catch (e) {
        return { error: { message: "Não foi possível alcançar o servidor do Supabase. Verifique sua internet." } };
    }
}

async function executarAutenticacao() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!email || !senha) {
        alert("⚠️ Por favor, preencha todos os campos.");
        return;
    }

    if (modoLogin) {
        // LOGIN DIRETO VIA API
        const resultado = await requisicaoAuth('token?grant_type=password', { email, password: senha });
        if (resultado.error || resultado.error_description) {
            alert("❌ Erro ao entrar: " + (resultado.error_description || resultado.error.message));
        } else {
            alert("✅ Login realizado com sucesso!");
        }
    } else {
        // CADASTRO DIRETO VIA API
        const resultado = await requisicaoAuth('signup', { email, password: senha });
        if (resultado.error) {
            alert("❌ Erro ao cadastrar: " + resultado.error.message);
        } else {
            alert("🎉 Usuário registrado com sucesso! Você já pode realizar o login.");
            alternarModo();
        }
    }
}
</script>
</body>
</html>
